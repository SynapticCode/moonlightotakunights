<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Your Night — Moonlight Otaku Nights</title>
<meta name="description" content="Drop your photos from the night. We feature our favorites on the recap page and on our IG.">
<meta name="robots" content="noindex,nofollow">

<link rel="icon" type="image/x-icon" href="/favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/components/theme.css">

<style>
  html, body { margin: 0; padding: 0; background: #0a0a0f; color: #e8e8f0;
               font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 80px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .brand img { height: 36px; width: auto; }
  .brand .name { font-family: "Orbitron", sans-serif; font-weight: 700;
                 letter-spacing: 0.08em; color: #00f0ff; font-size: 14px; text-transform: uppercase; }
  h1 { font-family: "Orbitron", sans-serif; font-weight: 800; font-size: 28px;
       margin: 0 0 8px; letter-spacing: 0.02em; }
  .sub { color: #b8b8c8; margin: 0 0 28px; line-height: 1.55; }
  .sub a { color: #ff4d9d; text-decoration: none; }
  form { display: flex; flex-direction: column; gap: 16px; }
  label { font-size: 13px; color: #c8c8d8; text-transform: uppercase;
          letter-spacing: 0.06em; font-weight: 600; }
  input[type=text], input[type=email], textarea {
    width: 100%; box-sizing: border-box;
    background: #15151f; color: #fff; border: 1px solid #2a2a3a;
    border-radius: 6px; padding: 12px 14px; font-size: 15px;
    font-family: inherit;
  }
  input[type=text]:focus, input[type=email]:focus, textarea:focus {
    outline: none; border-color: #00f0ff; box-shadow: 0 0 0 3px rgba(0,240,255,0.15);
  }
  textarea { resize: vertical; min-height: 70px; }
  .file-drop {
    display: block;
    border: 2px dashed #3a3a4f; border-radius: 8px; padding: 32px 16px;
    text-align: center; background: #12121b; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-top: 6px;
  }
  .file-drop:hover, .file-drop.drag, .file-drop:focus-within { border-color: #00f0ff; background: #161624; }
  .file-drop p { margin: 0 0 4px; color: #b8b8c8; font-size: 14px; line-height: 1.5; }
  .file-drop p:last-child { margin-bottom: 0; }
  .file-drop strong { color: #fff; display: block; font-size: 15px; margin-bottom: 6px; }
  .file-drop input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
  .preview { display: none; margin-top: 12px; }
  .preview img { width: 100%; max-height: 320px; object-fit: contain;
                 border-radius: 6px; border: 1px solid #2a2a3a; background: #000; }
  .consent { display: flex; gap: 10px; align-items: flex-start;
             font-size: 13px; color: #c8c8d8; line-height: 1.45; }
  .consent input { margin-top: 3px; }
  .consent a { color: #ff4d9d; text-decoration: none; }
  button[type=submit] {
    background: linear-gradient(135deg, #ff4d9d 0%, #00f0ff 100%);
    color: #0a0a0f; border: none; padding: 14px 18px; border-radius: 6px;
    font-family: "Orbitron", sans-serif; font-weight: 800; font-size: 15px;
    letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button[type=submit]:hover:not(:disabled) {
    transform: translateY(-1px); box-shadow: 0 6px 24px rgba(255,77,157,0.35);
  }
  button[type=submit]:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { padding: 14px 16px; border-radius: 6px; font-size: 14px; display: none; }
  .status.ok { display: block; background: rgba(0,240,255,0.08); border: 1px solid #00f0ff; color: #b8f4ff; }
  .status.err { display: block; background: rgba(255,77,77,0.08); border: 1px solid #ff4d4d; color: #ffb8b8; }
  .small { font-size: 12px; color: #8a8a9a; }
  footer { margin-top: 40px; font-size: 12px; color: #6a6a7a; text-align: center; }
  footer a { color: #8a8a9a; text-decoration: none; }
</style>
</head>
<body>

<div class="wrap">

  <div class="brand">
    <img src="/components/assets/logo-mark.png" alt="Moonlight Otaku Nights" onerror="this.style.display='none'">
    <span class="name">Moonlight Otaku Nights</span>
  </div>

  <h1 id="page-title">Share your night.</h1>
  <p class="sub" id="page-sub">
    Drop a photo from the night. We feature our favorites on the recap page and on
    <a href="https://instagram.com/moonlightotakunights" data-ig="moonlightotakunights" target="_blank" rel="noopener">@moonlightotakunights</a>.
  </p>

  <form id="ugc-form" novalidate>
    <input type="hidden" name="event_slug" id="event_slug" value="">

    <div>
      <label for="photo">Your photo</label>
      <label class="file-drop" id="file-drop" for="photo">
        <p><strong>Tap to choose a photo</strong></p>
        <p>or drag one in</p>
        <p class="small">JPG, PNG, WEBP, or HEIC — up to 8 MB</p>
        <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp,image/heic" required>
      </label>
      <div class="preview" id="preview"><img id="preview-img" alt=""></div>
    </div>

    <div>
      <label for="instagram_handle">Your Instagram (so we can tag you)</label>
      <input type="text" id="instagram_handle" name="instagram_handle" placeholder="@yourhandle" autocomplete="off" maxlength="60">
    </div>

    <div>
      <label for="display_name">Your name <span class="small">(optional)</span></label>
      <input type="text" id="display_name" name="display_name" maxlength="120" autocomplete="name">
    </div>

    <div>
      <label for="caption">Caption <span class="small">(optional)</span></label>
      <textarea id="caption" name="caption" maxlength="500" placeholder="Anything you want us to say with it"></textarea>
    </div>

    <label class="consent">
      <input type="checkbox" name="consent_age" required>
      <span>I'm 18 or older, this is my photo, and I'm in it (or have permission from everyone in it).</span>
    </label>

    <label class="consent">
      <input type="checkbox" name="consent_repost" required>
      <span>I give Moonlight Otaku Nights permission to repost this photo on our website and social media, with credit to the @handle I provided.</span>
    </label>

    <div class="status" id="status"></div>

    <button type="submit" id="submit-btn">Send it</button>

    <p class="small">By submitting you agree to our <a href="/privacy-policy/">privacy policy</a> and <a href="/terms/">terms</a>.</p>
  </form>

  <footer>
    <a href="/">moonlightotakunights.com</a>
  </footer>

</div>

<script src="/assets/js/ig-link.js"></script>
<script>
(function() {
  // Read ?event= from URL
  var params = new URLSearchParams(location.search);
  var ev = (params.get('event') || '').replace(/[^a-z0-9\-_]/gi, '').slice(0, 80);
  document.getElementById('event_slug').value = ev;

  // Niceify title if event present (cosmetic only)
  var pretty = {
    'miku-vol-02': 'Hatsune Miku After Party',
    'elven-grove': 'Elven Grove'
  };
  if (pretty[ev]) {
    document.getElementById('page-sub').innerHTML =
      'Drop a photo from <strong>' + pretty[ev] + '</strong>. We feature our favorites on the recap page and on ' +
      '<a href="https://instagram.com/moonlightotakunights" data-ig="moonlightotakunights" target="_blank" rel="noopener">@moonlightotakunights</a>.';
    if (window.MoonlightIG && window.MoonlightIG.wire) window.MoonlightIG.wire();
  }

  var fileInput = document.getElementById('photo');
  var drop = document.getElementById('file-drop');
  var preview = document.getElementById('preview');
  var previewImg = document.getElementById('preview-img');
  var status = document.getElementById('status');
  var btn = document.getElementById('submit-btn');
  var form = document.getElementById('ugc-form');

  function setStatus(kind, msg) {
    status.className = 'status ' + kind;
    status.textContent = msg;
  }

  fileInput.addEventListener('change', function(e) {
    var f = fileInput.files[0];
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) {
      setStatus('err', 'That file is over 8 MB. Try a smaller one.');
      fileInput.value = '';
      return;
    }
    var url = URL.createObjectURL(f);
    previewImg.src = url;
    preview.style.display = 'block';
    setStatus('', '');
    status.style.display = 'none';
  });

  ['dragover','dragleave','drop'].forEach(function(evt) {
    drop.addEventListener(evt, function(e) {
      e.preventDefault(); e.stopPropagation();
      if (evt === 'dragover') drop.classList.add('drag');
      else drop.classList.remove('drag');
      if (evt === 'drop' && e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event('change'));
      }
    });
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (!fileInput.files[0]) { setStatus('err', 'Pick a photo first.'); return; }
    if (!form.consent_age.checked || !form.consent_repost.checked) {
      setStatus('err', 'Please check both consent boxes.'); return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending…';
    setStatus('ok', 'Uploading…');

    var fd = new FormData(form);
    fetch('https://dashboard.moonlightotakunights.com/api/ugc/submit.php', {
      method: 'POST',
      body: fd,
      credentials: 'omit'
    })
    .then(function(r) { return r.json().then(function(j) { return { status: r.status, body: j }; }); })
    .then(function(res) {
      if (res.body && res.body.ok) {
        setStatus('ok', 'Got it. We\'ll review and post our favorites soon. Thank you.');
        form.style.display = 'none';
      } else {
        setStatus('err', (res.body && res.body.error) ? res.body.error : 'Something went wrong. Try again.');
        btn.disabled = false; btn.textContent = 'Send it';
      }
    })
    .catch(function(err) {
      setStatus('err', 'Network error. Try again.');
      btn.disabled = false; btn.textContent = 'Send it';
    });
  });
})();
</script>

</body>
</html>
