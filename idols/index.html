<body class="moonlight-theme">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WX8WHXSZ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="sub-wrap">
  <div class="sub-brand">
    <img src="/assets/images/logos/Moonlight Otaku Nights Logo no background clean version.png" alt="">
    <span class="name">Moonlight Otaku Nights</span>
  </div>

  <div class="sub-hero">
    <h1>TAKE THE STAGE.</h1>
    <p class="sub">Looking for idol routines, dance covers, vocaloid performers, and stage acts that hit the anime-nightlife crowd. Solo or group, both work.</p>
  </div>

  <form class="sub-form" data-mln-submission="idol" autocomplete="off">
    <input type="text" name="website_hp" class="honeypot" tabindex="-1" autocomplete="off">

    <div class="row-2">
      <div>
        <label>Your Name <span class="req">*</span></label>
        <input type="text" name="full_name" required maxlength="255">
      </div>
      <div>
        <label>Stage / Group Name</label>
        <input type="text" name="stage_name" maxlength="120">
      </div>
    </div>

    <div class="row-2">
      <div>
        <label>Email <span class="req">*</span></label>
        <input type="email" name="email" required>
      </div>
      <div>
        <label>Phone</label>
        <input type="tel" name="phone">
      </div>
    </div>

    <div class="row-2">
      <div>
        <label>Instagram</label>
        <input type="text" name="instagram" placeholder="handle (no @)">
      </div>
      <div>
        <label>Performance Type <span class="req">*</span></label>
        <select name="performance_type" required>
          <option value="">— choose one —</option>
          <option>Idol routine</option>
          <option>Dance cover</option>
          <option>Vocaloid / cosplay vocal</option>
          <option>Stage / theatrical</option>
          <option>Other</option>
        </select>
      </div>
    </div>

    <div class="row-2">
      <div>
        <label>Group Size</label>
        <input type="number" name="group_size" min="1" max="20" placeholder="1">
      </div>
      <div>
        <label>Set Length (min)</label>
        <input type="number" name="set_length_min" min="3" max="60" placeholder="15">
      </div>
    </div>

    <div>
      <label>Demo / Video Link</label>
      <input type="url" name="demo_url" placeholder="https://youtube.com/...">
    </div>

    <div>
      <label>Tell us about your act <span class="req">*</span></label>
      <textarea name="pitch" required minlength="20" maxlength="5000" placeholder="Describe what you'd perform, your experience, and what equipment you need."></textarea>
    </div>

    <button type="submit" class="sub-btn">Send Application</button>
    <div class="sub-status"></div>
  </form>
</div>

<script src="/components/submission-form.js"></script>
</body>
</html>
