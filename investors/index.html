<body class="moonlight-theme">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WX8WHXSZ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="sub-wrap">
  <div class="sub-brand">
    <img src="/assets/images/logos/Moonlight Otaku Nights Logo no background clean version.png" alt="">
    <span class="name">Moonlight Otaku Nights</span>
  </div>

  <div class="sub-hero">
    <h1>BUILD THE FUTURE WITH US.</h1>
    <p class="sub">Newark's first-mover anime nightlife brand — built on a 90-mile pull radius, monthly residency, and an upcoming three-stage festival on Mulberry Commons. Curious about partnership or capital? Tell us what you're thinking.</p>
  </div>

  <form class="sub-form" data-mln-submission="investor" autocomplete="off">
    <input type="text" name="website_hp" class="honeypot" tabindex="-1" autocomplete="off">

    <div class="row-2">
      <div>
        <label>Name <span class="req">*</span></label>
        <input type="text" name="full_name" required maxlength="255">
      </div>
      <div>
        <label>Company / Fund</label>
        <input type="text" name="org_name" maxlength="255">
      </div>
    </div>

    <div class="row-2">
      <div>
        <label>Email <span class="req">*</span></label>
        <input type="email" name="email" required>
      </div>
      <div>
        <label>Phone</label>
        <input type="tel" name="phone">
      </div>
    </div>

    <div>
      <label>Website</label>
      <input type="url" name="website" placeholder="https://...">
    </div>

    <div class="row-2">
      <div>
        <label>Investor Type</label>
        <select name="investor_type">
          <option value="">— choose one —</option>
          <option>Venue partner</option>
          <option>Angel</option>
          <option>Fund / VC</option>
          <option>Strategic / brand</option>
          <option>Friends & family</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label>Check Size</label>
        <select name="check_size">
          <option value="">— choose one —</option>
          <option>Under $5K</option>
          <option>$5K — $25K</option>
          <option>$25K — $100K</option>
          <option>$100K+</option>
          <option>In-kind / partnership</option>
        </select>
      </div>
    </div>

    <div>
      <label>Timeline</label>
      <select name="timeline">
        <option value="">— choose one —</option>
        <option>This month</option>
        <option>This quarter</option>
        <option>Exploratory</option>
      </select>
    </div>

    <div>
      <label>Tell us what you're looking for <span class="req">*</span></label>
      <textarea name="pitch" required minlength="20" maxlength="5000" placeholder="What draws you to Moonlight? What does an ideal partnership look like?"></textarea>
    </div>

    <button type="submit" class="sub-btn">Open the Conversation</button>
    <div class="sub-status"></div>
  </form>
</div>

<script src="/components/submission-form.js"></script>
</body>
</html>
