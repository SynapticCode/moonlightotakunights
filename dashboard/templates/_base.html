<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="dark only">
    <meta name="supported-color-schemes" content="dark only">
    <title>{{ heading }}</title>
    <!--[if mso]>
    <style type="text/css">table { border-collapse: collapse; } td { font-family: Arial, sans-serif; }</style>
    <![endif]-->
    <style>
        /* Email clients strip most CSS — keep inline-friendly here. */
        body { margin: 0; padding: 0; width: 100% !important; background-color: #0a0a0f; }
        table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { border: 0; line-height: 100%; outline: none; text-decoration: none; display: block; }
        a { color: #00f0ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .preheader { display: none !important; visibility: hidden; opacity: 0; color: transparent; height: 0; width: 0; overflow: hidden; mso-hide: all; }
        @media (max-width: 620px) {
            .container { width: 100% !important; }
            .px-32 { padding-left: 20px !important; padding-right: 20px !important; }
            .h1 { font-size: 26px !important; line-height: 1.2 !important; }
            .btn-cell { padding-left: 24px !important; padding-right: 24px !important; }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color:#0a0a0f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">

    <!-- Preheader (hidden, shown as preview text in inbox) -->
    <div class="preheader">{{ preheader }}</div>

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#0a0a0f;">
        <tr>
            <td align="center" style="padding: 32px 16px;">

                <!-- Outer container -->
                <table role="presentation" class="container" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px; max-width:600px; background-color:#0f0f18; border:1px solid rgba(0,240,255,0.18); border-radius:6px; overflow:hidden;">

                    <!-- Top accent bar -->
                    <tr>
                        <td height="3" style="background: linear-gradient(90deg, #ac2181, #694591, #7fbbe0, #00f0ff); line-height:3px; font-size:0;">&nbsp;</td>
                    </tr>

                    <!-- Header / brand -->
                    <tr>
                        <td class="px-32" align="center" style="padding: 32px 32px 16px;">
                            <a href="{{ brand_url }}" style="text-decoration:none;">
                                <img src="{{ brand_logo }}" alt="{{ brand_name }}" width="64" height="64" style="display:inline-block; height:64px; width:64px;">
                            </a>
                            <div style="font-family: 'Orbitron', Arial, sans-serif; font-size:11px; letter-spacing:4px; color:#7fbbe0; margin-top:14px; text-transform:uppercase;">{{ brand_name }}</div>
                        </td>
                    </tr>

                    <!-- Subheading (Japanese / katakana label) -->
                    <tr>
                        <td class="px-32" align="center" style="padding: 0 32px;">
                            <div style="font-family: 'Courier New', monospace; font-size:11px; letter-spacing:3px; color:rgba(255,255,255,0.4); text-transform:uppercase;">{{ subheading }}</div>
                        </td>
                    </tr>

                    <!-- Main heading -->
                    <tr>
                        <td class="px-32" align="center" style="padding: 14px 32px 8px;">
                            <h1 class="h1" style="margin:0; font-family: 'Orbitron', 'Helvetica Neue', Arial, sans-serif; font-size:32px; font-weight:800; line-height:1.1; color:#ffffff; letter-spacing:0.02em;">
                                {{ heading }}
                            </h1>
                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td align="center" style="padding: 18px 32px 0;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="40">
                                <tr><td height="2" style="background-color:#00f0ff; line-height:2px; font-size:0;">&nbsp;</td></tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td class="px-32" style="padding: 24px 32px 8px;">
                            <p style="margin:0 0 16px; font-size:15px; line-height:1.7; color:rgba(255,255,255,0.85);">
                                Hey {{ first_name }} —
                            </p>
                            <p style="margin:0 0 24px; font-size:15px; line-height:1.7; color:rgba(255,255,255,0.78);">
                                {{ body }}
                            </p>

                            {{ body_extra }}
                        </td>
                    </tr>

                    <!-- CTA button -->
                    <tr>
                        <td class="btn-cell" align="center" style="padding: 8px 32px 32px;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="center" bgcolor="#00f0ff" style="background: linear-gradient(135deg, #00f0ff, #0088b8); border-radius:4px;">
                                        <a href="{{ cta_url }}" style="display:inline-block; padding:14px 32px; font-family: 'Orbitron', Arial, sans-serif; font-size:13px; font-weight:700; letter-spacing:0.2em; color:#0a0a0f; text-decoration:none; text-transform:uppercase;">
                                            {{ cta_label }}
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer note -->
                    <tr>
                        <td class="px-32" style="padding: 0 32px 24px;">
                            <p style="margin:0; font-size:12px; line-height:1.6; color:rgba(255,255,255,0.45); text-align:center;">
                                {{ footer_note }}
                            </p>
                        </td>
                    </tr>

                    <!-- Bottom accent bar -->
                    <tr>
                        <td height="3" style="background: linear-gradient(90deg, #00f0ff, #7fbbe0, #694591, #ac2181); line-height:3px; font-size:0;">&nbsp;</td>
                    </tr>
                </table>

                <!-- Outer footer / unsubscribe -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px; max-width:600px;">
                    <tr>
                        <td align="center" style="padding: 24px 16px; font-family: Arial, sans-serif; font-size:11px; line-height:1.6; color:rgba(255,255,255,0.35);">
                            &copy; {{ year }} {{ brand_name }} &middot; Newark, NJ<br>
                            <a href="{{ brand_url }}" style="color:rgba(127,187,224,0.55); text-decoration:none;">moonlightotakunights.com</a>
                            &nbsp;&middot;&nbsp;
                            <a href="{{ unsubscribe_url }}" style="color:rgba(127,187,224,0.55); text-decoration:underline;">Unsubscribe</a>
                            &nbsp;&middot;&nbsp;
                            <a href="mailto:{{ support_email }}" style="color:rgba(127,187,224,0.55); text-decoration:none;">{{ support_email }}</a>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
