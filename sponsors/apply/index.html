<meta name="description" content="Put your brand in front of the anime nightlife crowd. Sponsorship tiers for QXT's residency and the Mulberry festival.">

<body class="moonlight-theme">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WX8WHXSZ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="sub-wrap">
  <div class="sub-brand">
    <img src="/assets/images/logos/Moonlight Otaku Nights Logo no background clean version.png" alt="">
    <span class="name">Moonlight Otaku Nights</span>
  </div>

  <div class="sub-hero">
    <h1>SPONSOR THE NIGHT.</h1>
    <p class="sub">Anime, cosplay, lifestyle, gaming, energy — if your brand belongs at a Moonlight night, let's talk. We'll send the full sponsor deck after we review your inquiry.</p>
  </div>

  <form class="sub-form" data-mln-submission="sponsor" autocomplete="off">
    <input type="text" name="website_hp" class="honeypot" tabindex="-1" autocomplete="off">

    <div class="row-2">
      <div>
        <label>Your Name <span class="req">*</span></label>
        <input type="text" name="full_name" required maxlength="255">
      </div>
      <div>
        <label>Brand / Company <span class="req">*</span></label>
        <input type="text" name="org_name" required maxlength="255">
      </div>
    </div>

    <div class="row-2">
      <div>
        <label>Email <span class="req">*</span></label>
        <input type="email" name="email" required>
      </div>
      <div>
        <label>Phone</label>
        <input type="tel" name="phone">
      </div>
    </div>

    <div class="row-2">
      <div>
        <label>Instagram</label>
        <input type="text" name="instagram" placeholder="brand handle">
      </div>
      <div>
        <label>Website</label>
        <input type="url" name="website" placeholder="https://...">
      </div>
    </div>

    <div class="row-2">
      <div>
        <label>Brand Category</label>
        <select name="brand_category">
          <option value="">— choose one —</option>
          <option>Apparel / fashion</option>
          <option>Gaming / tech</option>
          <option>Beverage / energy</option>
          <option>Food</option>
          <option>Beauty / lifestyle</option>
          <option>Anime / pop-culture</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label>Budget Tier</label>
        <select name="budget_tier">
          <option value="">— choose one —</option>
          <option>Under $500</option>
          <option>$500 — $2K</option>
          <option>$2K — $10K</option>
          <option>$10K+</option>
          <option>In-kind / product</option>
        </select>
      </div>
    </div>

    <div>
      <label>Sponsorship Goals</label>
      <textarea name="goals" maxlength="2000" placeholder="What does success look like — impressions, samples handed out, signups, sales?"></textarea>
    </div>

    <div>
      <label>Tell us about your brand <span class="req">*</span></label>
      <textarea name="pitch" required minlength="20" maxlength="5000" placeholder="What you do, why anime nightlife fits, and what you'd love to bring to the night."></textarea>
    </div>

    <button type="submit" class="sub-btn">Send Sponsor Inquiry</button>
    <div class="sub-status"></div>
  </form>
</div>

<script src="/components/submission-form.js"></script>
</body>
</html>
