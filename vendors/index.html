<meta name="description" content="Apply for a vendor table at Moonlight events. Art, prints, apparel, accessories, food trucks.">

<body class="moonlight-theme">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WX8WHXSZ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="sub-wrap">
  <div class="sub-brand">
    <img src="/assets/images/logos/Moonlight Otaku Nights Logo no background clean version.png" alt="">
    <span class="name">Moonlight Otaku Nights</span>
  </div>

  <div class="sub-hero">
    <h1>VEND WITH US.</h1>
    <p class="sub">Tables at QXT's nights and (soon) the Mulberry festival. Tier pricing depends on location and event size — we'll send the rate card after we review your application.</p>
  </div>

  <form class="sub-form" data-mln-submission="vendor" autocomplete="off">
    <input type="text" name="website_hp" class="honeypot" tabindex="-1" autocomplete="off">

    <div class="row-2">
      <div>
        <label>Your Name <span class="req">*</span></label>
        <input type="text" name="full_name" required maxlength="255">
      </div>
      <div>
        <label>Business / Brand Name</label>
        <input type="text" name="org_name" maxlength="255">
      </div>
    </div>

    <div class="row-2">
      <div>
        <label>Email <span class="req">*</span></label>
        <input type="email" name="email" required>
      </div>
      <div>
        <label>Phone</label>
        <input type="tel" name="phone">
      </div>
    </div>

    <div class="row-2">
      <div>
        <label>Instagram</label>
        <input type="text" name="instagram" placeholder="handle (no @)">
      </div>
      <div>
        <label>Website / Shop</label>
        <input type="url" name="website" placeholder="https://...">
      </div>
    </div>

    <div class="row-2">
      <div>
        <label>Vendor Type <span class="req">*</span></label>
        <select name="vendor_type" required>
          <option value="">— choose one —</option>
          <option>Art / prints</option>
          <option>Apparel / fashion</option>
          <option>Accessories / jewelry</option>
          <option>Plushes / figures</option>
          <option>Food / drink</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label>Tier Preference</label>
        <select name="tier_pref">
          <option value="">— no preference —</option>
          <option>Tier 1 (premium / front)</option>
          <option>Tier 2 (mid / general floor)</option>
          <option>Tier 3 (outer / starter)</option>
        </select>
      </div>
    </div>

    <div class="row-2">
      <label class="check"><input type="checkbox" name="needs_power"> <span>Need power outlet</span></label>
      <label class="check"><input type="checkbox" name="needs_table"> <span>Need table provided</span></label>
    </div>

    <div>
      <label>What are you selling? <span class="req">*</span></label>
      <textarea name="products_sold" maxlength="2000" placeholder="Quick list of products and price range."></textarea>
    </div>

    <div>
      <label>Anything else we should know? <span class="req">*</span></label>
      <textarea name="pitch" required minlength="10" maxlength="5000" placeholder="Past events, audience fit, special requests."></textarea>
    </div>

    <button type="submit" class="sub-btn">Send Application</button>
    <div class="sub-status"></div>
  </form>
</div>

<script src="/components/submission-form.js"></script>
</body>
</html>
